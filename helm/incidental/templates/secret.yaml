{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "incidental.fullname" . }}
  labels:
    {{- include "incidental.labels" . | nindent 4 }}
type: Opaque
stringData:
  MATTERMOST_API_TOKEN: {{ required "secret.mattermostApiToken is required" .Values.secret.mattermostApiToken | quote }}
  INCIDENT_API_KEY: {{ required "secret.incidentApiKey is required" .Values.secret.incidentApiKey | quote }}
  {{- if and (not .Values.existingSecrets.confluence) .Values.secret.confluenceApiToken }}
  CONFLUENCE_API_TOKEN: {{ .Values.secret.confluenceApiToken | quote }}
  {{- end }}
  {{- if and (not .Values.existingSecrets.jira) .Values.secret.jiraApiToken }}
  JIRA_API_TOKEN: {{ .Values.secret.jiraApiToken | quote }}
  {{- end }}
  {{- if and (not .Values.existingSecrets.gitlab) .Values.secret.gitlabToken }}
  GITLAB_TOKEN: {{ .Values.secret.gitlabToken | quote }}
  {{- end }}
{{- end }}
